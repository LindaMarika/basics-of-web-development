<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Ville Heikkiniemi" />
    <link rel="icon" href="favicon.ico" />

    <title>Centria Edu | Basics of Web Development</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <div class="container">
        <nav>
          <div class="logo">centria <span>edu</span></div>

          <ul>
            <li>
              <a href="index.html">Home</a>
            </li>
            <li><a href="index.html#topics">Topics</a></li>
            <li><a href="#">About</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li>
              <a href="contact.html" aria-current="page">Contact</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <section class="topics" id="contact">
        <div class="container">
          <h2>Contact us</h2>
          <p>Please fill in the form below to get in touch.</p>

          <form class="card" action="https://httpbin.org/post" method="post">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required />

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />

            <label for="phone">Phone number</label>
            <input type="tel" id="phone" name="phone" />

            <label for="subject">Contact subject</label>
            <select id="subject" name="subject" required>
              <option value="">Choose a subject</option>
              <option value="general">General question</option>
              <option value="course">Course question</option>
              <option value="feedback">Feedback</option>
            </select>

            <p>Preferred contact method</p>

            <label>
              <input type="radio" name="contact_method" value="email" />
              Email
            </label>

            <label>
              <input type="radio" name="contact_method" value="phone" />
              Phone
            </label>

            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>

            <button type="submit">Send</button>
          </form>
        </div>
      </section>
    </main>

    <footer>
      <div class="container">
        <p>&copy; 2026 Centria Edu</p>
      </div>
    </footer>
  </body>
</html>
